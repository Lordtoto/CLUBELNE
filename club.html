<title>Suivi Foot ⚽</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#eef1f6; --card:#ffffff; --ink:#101a30; --muted:#6a7690;
    --line:#e2e7f0; --navy:#14224A; --navy2:#26407a; --red:#D6222E; --gold:#C98A06;
    --gold-b:#E3A70B; --royal:#1E5AA8; --goals:#1E5AA8; --assists:#C98A06; --danger:#D6222E;
    --shadow:0 1px 3px rgba(16,26,48,.07),0 8px 24px rgba(16,26,48,.06);
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme: dark){
    --bg:#0a0f1c; --card:#121a2e; --ink:#e7ecf6; --muted:#8b97b3; --line:#222d47;
    --navy:#1b2f5e; --navy2:#2f4d8f; --gold:#E3A70B; --gold-b:#F0C419; --royal:#3d7fd6;
    --goals:#4b90e0; --assists:#E3A70B; --danger:#e8535d;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5); } }
  :root[data-theme="dark"]{
    --bg:#0a0f1c; --card:#121a2e; --ink:#e7ecf6; --muted:#8b97b3; --line:#222d47;
    --navy:#1b2f5e; --navy2:#2f4d8f; --gold:#E3A70B; --gold-b:#F0C419; --royal:#3d7fd6;
    --goals:#4b90e0; --assists:#E3A70B; --danger:#e8535d;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5); }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 120px}
  .band{background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:18px;padding:16px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .band img{width:46px;height:auto;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));z-index:1}
  .band .ht{z-index:1}
  .band h1{font-size:20px;margin:0;color:#fff;letter-spacing:-.3px}
  .band p{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.75)}
  .gear{position:absolute;top:10px;right:10px;z-index:2;background:rgba(255,255,255,.16);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:16px;line-height:1;cursor:pointer}
  .gear:active{background:rgba(255,255,255,.3)}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:var(--shadow)}
  .kpi.star{background:linear-gradient(135deg,var(--navy),var(--royal));border:none;color:#fff}
  .kpi .lab{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600}
  .kpi.star .lab{color:rgba(255,255,255,.82)}
  .kpi .val{font-size:30px;font-weight:800;letter-spacing:-1px;margin-top:2px;line-height:1}
  .kpi.star .val{color:#fff}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .kpi.star .sub{color:rgba(255,255,255,.8)}
  .row2{display:flex;gap:10px;margin-top:10px}.row2 .kpi{flex:1}.mini .val{font-size:22px}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:24px 4px 10px;font-weight:700;display:flex;align-items:center;gap:7px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .pad{padding:14px}
  .chart svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:16px;justify-content:center;margin-top:8px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .pos-grid{display:flex;flex-wrap:wrap;gap:8px}
  .pos-tag{display:flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px}
  .pos-tag b{background:var(--navy);color:#fff;border-radius:8px;padding:1px 8px;font-size:12.5px}
  .lead{width:100%;border-collapse:collapse}
  .lead td{padding:9px 4px;border-bottom:1px solid var(--line);font-size:14.5px}
  .lead tr:last-child td{border-bottom:none}
  .lead .nm{font-weight:600}.lead .isy .nm{color:var(--royal)}
  .lead .num{text-align:right;color:var(--muted);width:56px}
  .lead .g{font-weight:700;color:var(--ink)}
  .rankdot{display:inline-block;width:20px;color:var(--muted);font-size:12.5px}
  .pl{margin-bottom:11px;overflow:hidden}
  .pl .head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
  .pl .dt{font-weight:700;font-size:15px}
  .pl .rec{margin-left:auto;display:flex;gap:5px}
  .pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
  .pill.w{background:rgba(30,90,168,.15);color:var(--royal)}
  .pill.d{background:rgba(120,120,120,.16);color:var(--muted)}
  .pill.l{background:rgba(214,34,46,.14);color:var(--danger)}
  .pl .isyline{padding:0 14px 8px;font-size:13.5px;color:var(--muted)}
  .pl .isyline b{color:var(--royal)}
  .postags{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 12px}
  .postag{font-size:11px;font-weight:700;background:var(--navy);color:#fff;border-radius:20px;padding:3px 9px}
  .postag.coach{background:var(--gold)}
  .pl .body{border-top:1px solid var(--line);padding:12px 14px;display:none}
  .pl.open .body{display:block}.pl.open .chev{transform:rotate(90deg)}
  .chev{color:var(--muted);transition:transform .18s;font-size:13px}
  .mt{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0}
  .mt .sc{font-weight:700}.mt .sc.win{color:var(--royal)}.mt .sc.loss{color:var(--danger)}
  .brk{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}.brk b{color:var(--ink)}
  .pact{display:flex;gap:8px;margin-top:12px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .btn.sm{padding:6px 10px;font-size:12.5px}
  .btn.del{color:var(--danger);border-color:rgba(214,34,46,.3)}
  .fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,var(--navy),var(--royal));color:#fff;border:none;padding:15px 24px;border-radius:30px;font-size:15.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(20,34,74,.45);z-index:40;display:none;align-items:center;gap:8px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}.scrim.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;display:none;flex-direction:column;max-width:640px;margin:0 auto}
  .sheet.on{display:flex}
  .sheet .sh{display:flex;align-items:center;padding:16px 16px 8px;gap:10px}
  .sheet .sh h3{margin:0;font-size:17px}
  .sheet .sh .x{margin-left:auto;background:none;border:none;color:var(--muted);font-size:26px;cursor:pointer}
  .sheet .scroll{overflow-y:auto;padding:4px 16px 16px}
  .field{margin:14px 0 4px}
  .field label{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;display:block;margin-bottom:7px}
  input[type=date],input[type=email],input[type=password],input.txt{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font-size:15px;font-family:inherit}
  .subsec{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;margin:18px 0 9px;display:flex;align-items:center}
  .subsec .add{margin-left:auto;color:var(--royal);font-weight:700;cursor:pointer;font-size:12.5px;text-transform:none}
  .posrow{display:flex;flex-wrap:wrap;gap:8px}
  .postoggle{border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:22px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
  .postoggle.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .mrow,.prow{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .mrow input.opp,.prow input.pn{flex:1;min-width:0;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:14.5px;font-family:inherit}
  .score{display:flex;align-items:center;gap:6px}
  .stepper{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{width:38px;height:40px;border:none;background:none;color:var(--royal);font-size:22px;cursor:pointer;font-weight:600}
  .stepper .n{min-width:26px;text-align:center;font-size:16px;font-weight:700}
  .sep{color:var(--muted);font-weight:700}
  .rm{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}
  .save{width:100%;margin:20px 0 6px;padding:15px;background:linear-gradient(135deg,var(--navy),var(--royal));color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer}
  .hint{font-size:12.5px;color:var(--muted);margin-top:8px}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
  .empty .big{font-size:40px;margin-bottom:10px}
  .auth{max-width:420px;margin:8vh auto 0;padding:0 18px}
  .auth .logo{text-align:center;margin-bottom:18px}
  .auth .logo img{width:76px}
  .auth h1{text-align:center;font-size:22px;margin:6px 0 2px}
  .auth .tag{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:18px}
  .switch{text-align:center;margin-top:14px;font-size:13.5px;color:var(--muted)}
  .switch a{color:var(--royal);font-weight:700;cursor:pointer}
  .err{background:rgba(214,34,46,.1);border:1px solid rgba(214,34,46,.3);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
  .ok{background:rgba(30,90,168,.1);border:1px solid rgba(30,90,168,.3);color:var(--royal);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:12px}
</style>
</head>

<script>
/* ================= CONFIGURATION SUPABASE ================= */
/*  Remplace ces deux valeurs par celles de TON projet club   */
/*  (Supabase → Project Settings → API)                       */
const SUPABASE_URL = '__SUPABASE_URL__';
const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';
/* ========================================================== */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const POSITIONS = ["Gardien","Défense","Aile G","Aile D","Milieu","Attaque"];
let STAR = "", TEAM = "";
let USER = null, PROFILE = null;
let state = { plateaux:[], loading:true, draft:null, view:"auth", authMode:"in" };

/* ---------- démarrage / session ---------- */
(async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ state.loading=false; renderAuth(); return; }
  USER = session.user;
  await afterLogin();
})();
sb.auth.onAuthStateChange((_e, session)=>{
  if(!session){ USER=null; PROFILE=null; state.plateaux=[]; renderAuth(); }
});

async function afterLogin(){
  document.getElementById("app").innerHTML='<div class="empty"><div class="big">⏳</div>Chargement…</div>';
  try{
    const { data:prof } = await sb.from('profiles').select('*').maybeSingle();
    PROFILE = prof || null;
  }catch(e){ PROFILE=null; }
  if(!PROFILE){ state.loading=false; renderProfileSetup(); return; }
  STAR = PROFILE.player; TEAM = PROFILE.team||"";
  await loadPlateaux();
}
async function loadPlateaux(){
  try{
    const { data, error } = await sb.from('plateaux').select('*');
    state.plateaux = (!error && data) ? data : [];
  }catch(e){ state.plateaux=[]; }
  state.loading=false; render();
}

/* ---------- helpers ---------- */
function num(x){ return (+x||0); }
function fmtDate(iso){ if(!iso)return"—"; const p=String(iso).split("-"); return p[2]+"/"+p[1]; }
function sortedPlateaux(){ return [...state.plateaux].sort((a,b)=>(a.date||"").localeCompare(b.date||"")); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function show(el,on){ document.getElementById(el).style.display=on?"":"none"; }

async function doAuth(){
  const email=(document.getElementById("au-email").value||"").trim();
  const pass=document.getElementById("au-pass").value||"";
  if(!email||pass.length<6){ renderAuth({text:"Email valide + mot de passe d'au moins 6 caractères.",ok:false}); return; }
  const btn=document.getElementById("au-go"); btn.disabled=true; btn.textContent="…";
  try{
    if(state.authMode==="up"){
      const { data, error } = await sb.auth.signUp({ email, password:pass });
      if(error) throw error;
      if(!data.session){ renderAuth({text:"Compte créé. Vérifie tes emails pour confirmer, puis connecte-toi.",ok:true}); state.authMode="in"; return; }
      USER=data.user; await afterLogin();
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
      if(error) throw error;
      USER=data.user; await afterLogin();
    }
  }catch(e){
    const m=(e&&e.message||"").toLowerCase();
    let t="Erreur. Réessaie.";
    if(m.includes("invalid")) t="Email ou mot de passe incorrect.";
    else if(m.includes("already")) t="Cet email a déjà un compte. Connecte-toi.";
    else if(m.includes("confirm")) t="Confirme ton email avant de te connecter.";
    renderAuth({text:t,ok:false});
  }
}
async function logout(){ await sb.auth.signOut(); state.authMode="in"; renderAuth(); }

/* ================= PROFIL (1er lancement / réglages) ================= */
function renderProfileSetup(edit){
  show("band",false); document.getElementById("fab").style.display="none";
  const p=edit||PROFILE||{player:"",team:""};
  document.getElementById("app").innerHTML=
    '<div class="auth">'+
    '<h1 style="margin-top:6vh">'+(edit?"Modifier le profil":"Bienvenue 👋")+'</h1>'+
    '<p class="tag">'+(edit?"":"Configure le suivi de ton enfant")+'</p>'+
    '<div class="card pad">'+
      '<div class="field"><label>Prénom du joueur</label><input class="txt" id="pf-player" placeholder="Ex. Isayah" value="'+esc(p.player)+'"></div>'+
      '<div class="field"><label>Équipe / catégorie</label><input class="txt" id="pf-team" placeholder="Ex. Elne 2 · U8" value="'+esc(p.team||"")+'"></div>'+
      '<button class="save" id="pf-go">'+(edit?"Enregistrer":"C\'est parti ⚽")+'</button>'+
      (edit?'<button class="btn" id="pf-cancel" style="width:100%;margin-top:8px">Annuler</button>':'')+
      '<div class="switch" style="margin-top:16px"><a id="pf-logout">Se déconnecter</a></div>'+
    '</div></div>';
  document.getElementById("pf-go").onclick=saveProfile;
  const c=document.getElementById("pf-cancel"); if(c) c.onclick=()=>render();
  document.getElementById("pf-logout").onclick=logout;
}
async function saveProfile(){
  const player=(document.getElementById("pf-player").value||"").trim();
  const team=(document.getElementById("pf-team").value||"").trim();
  if(!player){ alert("Indique le prénom du joueur."); return; }
  const btn=document.getElementById("pf-go"); btn.disabled=true; btn.textContent="…";
  try{
    const row={ user_id:USER.id, player, team };
    const { error } = await sb.from('profiles').upsert(row);
    if(error) throw error;
    PROFILE=row; STAR=player; TEAM=team;
    await loadPlateaux();
  }catch(e){ btn.disabled=false; btn.textContent="Réessayer"; alert("Enregistrement impossible. Réessaie."); }
}
function openSettings(){ renderProfileSetup(Object.assign({},PROFILE)); }

/* ================= TOTALS ================= */
function totals(){
  let ig=0,ia=0,m=0,w=0,d=0,l=0; const sc={},as={},pos={},coaches={};
  state.plateaux.forEach(p=>{
    const cn=(p.coach||"").trim();
    if(cn && !coaches[cn]) coaches[cn]={w:0,d:0,l:0};
    (p.matches||[]).forEach(mt=>{ m++; const gf=num(mt.gf),ga=num(mt.ga);
      const r=gf>ga?'w':(gf<ga?'l':'d'); if(r==='w')w++; else if(r==='l')l++; else d++;
      if(cn) coaches[cn][r]++; });
    Object.entries(p.scorers||{}).forEach(([n,c])=>{ sc[n]=(sc[n]||0)+num(c); if(n===STAR)ig+=num(c); });
    Object.entries(p.assists||{}).forEach(([n,c])=>{ as[n]=(as[n]||0)+num(c); if(n===STAR)ia+=num(c); });
    (p.positions||[]).forEach(pp=>{ pos[pp]=(pos[pp]||0)+1; });
  });
  return {ig,ia,played:state.plateaux.length,m,w,d,l,sc,as,pos,coaches};
}

/* ================= RENDER PRINCIPAL ================= */
function render(){
  const app=document.getElementById("app"), fab=document.getElementById("fab");
  show("band",true); fab.style.display="flex";
  document.getElementById("playerName").textContent=STAR;
  document.getElementById("settingsBtn").onclick=openSettings;
  const list=sortedPlateaux();
  if(list.length===0){
    document.getElementById("subtitle").textContent=(TEAM?TEAM+" · ":"")+"Aucun plateau";
    app.innerHTML='<div class="empty"><div class="big">⚽</div><b>Aucun plateau enregistré.</b><br>Appuie sur « Ajouter un plateau » pour démarrer la saison de '+esc(STAR)+'.</div>';
    return;
  }
  const t=totals();
  document.getElementById("subtitle").textContent=(TEAM?TEAM+" · ":"")+t.played+" plateau"+(t.played>1?"x":"")+" · "+t.m+" match"+(t.m>1?"s":"");
  let h='';
  h+='<div class="kpis">';
  h+=kpiStar("Buts de "+STAR,t.ig,"sur "+t.m+" match"+(t.m>1?"s":""));
  h+=kpiStar("Passes déc. "+STAR,t.ia,(t.ig+t.ia)+" contribution"+((t.ig+t.ia)>1?"s":""));
  h+='</div>';
  h+='<div class="row2">';
  h+=kpi("mini","Plateaux",t.played,"joués");
  h+=kpi("mini","Bilan matchs",t.w+"V "+t.d+"N "+t.l+"D", t.m?Math.round(100*t.w/t.m)+"% victoires":"—");
  h+='</div>';
  h+='<h2 class="sec">📈 Progression de '+esc(STAR)+'</h2>';
  h+='<div class="card pad chart">'+chart(list)+
     '<div class="legend"><span><i class="dot" style="background:var(--goals)"></i>Buts</span>'+
     '<span><i class="dot" style="background:var(--assists)"></i>Passes déc.</span></div></div>';
  const posEntries=Object.entries(t.pos).sort((a,b)=>b[1]-a[1]);
  if(posEntries.length){
    h+='<h2 class="sec">🧭 Postes de '+esc(STAR)+'</h2>';
    h+='<div class="card pad"><div class="pos-grid">'+posEntries.map(([p,n])=>'<div class="pos-tag">'+esc(p)+' <b>'+n+'</b></div>').join('')+'</div></div>';
  }
  h+='<h2 class="sec">🏅 Buteurs de l\'équipe</h2>';
  h+='<div class="card pad">'+leaderboard(t.sc,t.as)+'</div>';
  const coachEntries=Object.entries(t.coaches).sort((a,b)=>b[1].w-a[1].w);
  if(coachEntries.length){
    h+='<h2 class="sec">🎓 Bilan par coach</h2>';
    h+='<div class="card pad"><table class="lead">';
    coachEntries.forEach(([c,st])=>{ const tot=st.w+st.d+st.l, pct=tot?Math.round(100*st.w/tot):0;
      h+='<tr><td class="nm">'+esc(c)+'</td><td class="num"><span class="g" style="color:var(--royal)">'+st.w+'V</span> '+st.d+'N '+st.l+'D</td><td class="num">'+pct+'%</td></tr>'; });
    h+='</table></div>';
  }
  h+='<h2 class="sec">📅 Plateaux</h2>';
  [...list].reverse().forEach(p=>{ h+=plateauCard(p); });
  app.innerHTML=h;
  app.querySelectorAll("[data-tog]").forEach(el=>el.onclick=()=>{ el.closest(".pl").classList.toggle("open"); });
  app.querySelectorAll("[data-edit]").forEach(el=>el.onclick=e=>{e.stopPropagation();openEdit(el.dataset.edit);});
  app.querySelectorAll("[data-del]").forEach(el=>el.onclick=e=>{e.stopPropagation();delPlateau(el.dataset.del);});
}
function kpiStar(lab,val,sub){ return '<div class="kpi star"><div class="lab">'+lab+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div></div>'; }
function kpi(cls,lab,val,sub){ return '<div class="kpi '+cls+'"><div class="lab">'+lab+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div></div>'; }
function chart(list){
  const W=640,H=190,padB=26,padT=10,padX=8,n=list.length;
  const maxV=Math.max(1,...list.map(p=>Math.max(num((p.scorers||{})[STAR]),num((p.assists||{})[STAR]))));
  const slot=(W-padX*2)/n, bw=Math.min(16,slot/3.2), base=H-padB, sh=base-padT;
  let s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
  s+='<line x1="'+padX+'" y1="'+base+'" x2="'+(W-padX)+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>';
  list.forEach((p,i)=>{ const cx=padX+slot*i+slot/2;
    const g=num((p.scorers||{})[STAR]), a=num((p.assists||{})[STAR]);
    s+=bar(cx-bw-2,base-sh*g/maxV,bw,sh*g/maxV,"var(--goals)",g);
    s+=bar(cx+2,base-sh*a/maxV,bw,sh*a/maxV,"var(--assists)",a);
    s+='<text x="'+cx+'" y="'+(H-9)+'" text-anchor="middle" font-size="11" fill="var(--muted)">'+fmtDate(p.date)+'</text>'; });
  return s+'</svg>';
}
function bar(x,y,w,h,fill,val){ let r=''; if(h>0.5) r+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="'+fill+'"/>'; if(val>0) r+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+fill+'">'+val+'</text>'; return r; }
function leaderboard(sc,as){
  const names=Object.keys(sc);
  if(!names.length) return '<div style="color:var(--muted);font-size:14px">Aucun buteur enregistré.</div>';
  names.sort((a,b)=>sc[b]-sc[a]||a.localeCompare(b));
  let h='<table class="lead">';
  names.forEach((n,i)=>{ h+='<tr class="'+(n===STAR?'isy':'')+'"><td class="nm"><span class="rankdot">'+(i+1)+'</span>'+esc(n)+(n===STAR?' ⭐':'')+'</td><td class="num"><span class="g">'+sc[n]+'</span> buts</td><td class="num">'+(as[n]?as[n]+' pd':'')+'</td></tr>'; });
  return h+'</table>';
}
function plateauCard(p){
  const matches=p.matches||[]; let w=0,d=0,l=0;
  matches.forEach(m=>{const gf=num(m.gf),ga=num(m.ga); if(gf>ga)w++;else if(gf<ga)l++;else d++;});
  const isyG=num((p.scorers||{})[STAR]), isyA=num((p.assists||{})[STAR]);
  let pills=''; if(w)pills+='<span class="pill w">'+w+'V</span>'; if(d)pills+='<span class="pill d">'+d+'N</span>'; if(l)pills+='<span class="pill l">'+l+'D</span>';
  let h='<div class="card pl"><div class="head" data-tog="'+p.id+'"><span class="chev">▶</span>';
  h+='<div><div class="dt">'+(p.label?esc(p.label)+' · ':'')+fmtDate(p.date)+'</div></div><div class="rec">'+pills+'</div></div>';
  h+='<div class="isyline">'+esc(STAR)+' : <b>'+isyG+' but'+(isyG>1?'s':'')+'</b> · <b>'+isyA+' passe'+(isyA>1?'s':'')+' déc.</b></div>';
  const tags=(p.positions||[]).map(x=>'<span class="postag">'+esc(x)+'</span>');
  if((p.coach||"").trim()) tags.push('<span class="postag coach">🎓 '+esc(p.coach.trim())+'</span>');
  if(tags.length) h+='<div class="postags">'+tags.join('')+'</div>';
  h+='<div class="body">';
  matches.forEach(m=>{ const gf=num(m.gf),ga=num(m.ga); const cls=gf>ga?'win':(gf<ga?'loss':'');
    h+='<div class="mt"><span>'+esc(m.opponent||'Adversaire')+'</span><span class="sc '+cls+'">'+gf+' - '+ga+'</span></div>'; });
  const scs=Object.entries(p.scorers||{}).filter(([,c])=>num(c)>0).sort((a,b)=>b[1]-a[1]);
  if(scs.length) h+='<div class="brk"><b>Buteurs :</b> '+scs.map(([n,c])=>esc(n)+' '+c).join(' · ')+'</div>';
  const ass=Object.entries(p.assists||{}).filter(([,c])=>num(c)>0).sort((a,b)=>b[1]-a[1]);
  if(ass.length) h+='<div class="brk"><b>Passeurs :</b> '+ass.map(([n,c])=>esc(n)+' '+c).join(' · ')+'</div>';
  h+='<div class="pact"><button class="btn sm" data-edit="'+p.id+'">✏️ Modifier</button><button class="btn sm del" data-del="'+p.id+'">Supprimer</button></div>';
  return h+'</div></div>';
}

/* ================= FORMULAIRE PLATEAU ================= */
function today(){ return new Date().toISOString().slice(0,10); }
function blankDraft(){ return { id:null, date:today(), coach:"", positions:[], matches:[{opponent:"",gf:0,ga:0}], scorers:[{name:STAR,goals:0}], assists:[{name:STAR,goals:0}] }; }
function openAdd(){ state.draft=blankDraft(); showSheet("Nouveau plateau"); }
function openEdit(id){
  const p=state.plateaux.find(x=>x.id===id); if(!p)return;
  const scorers=Object.entries(p.scorers||{}).map(([name,goals])=>({name,goals:num(goals)}));
  const assists=Object.entries(p.assists||{}).map(([name,goals])=>({name,goals:num(goals)}));
  if(!scorers.some(s=>s.name===STAR)) scorers.unshift({name:STAR,goals:0});
  if(!assists.some(s=>s.name===STAR)) assists.unshift({name:STAR,goals:0});
  state.draft={ id:p.id, date:p.date||today(), coach:p.coach||"", positions:[...(p.positions||[])],
    matches:(p.matches||[]).map(m=>({opponent:m.opponent||"",gf:num(m.gf),ga:num(m.ga)})), scorers, assists };
  if(!state.draft.matches.length) state.draft.matches=[{opponent:"",gf:0,ga:0}];
  showSheet("Modifier le plateau");
}
function showSheet(title){ document.getElementById("sheetTitle").textContent=title; renderSheet();
  document.getElementById("scrim").classList.add("on"); document.getElementById("sheet").classList.add("on"); }
function closeSheet(){ document.getElementById("scrim").classList.remove("on"); document.getElementById("sheet").classList.remove("on"); state.draft=null; }
document.getElementById("fab").onclick=openAdd;
document.getElementById("closeSheet").onclick=closeSheet;
document.getElementById("scrim").onclick=closeSheet;

function renderSheet(){
  const d=state.draft; if(!d)return;
  let h='';
  h+='<div class="field"><label>Date du plateau</label><input type="date" id="f-date" value="'+d.date+'"></div>';
  h+='<div class="field"><label>Coach</label><input class="txt" id="f-coach" placeholder="Nom du coach" value="'+esc(d.coach||"")+'"></div>';
  h+='<div class="subsec">Poste(s) de '+esc(STAR)+'</div>';
  h+='<div class="posrow">'+POSITIONS.map(p=>'<button class="postoggle'+(d.positions.includes(p)?' on':'')+'" data-pos="'+esc(p)+'">'+esc(p)+'</button>').join('')+'</div>';
  h+='<div class="subsec">Matchs <span class="add" data-addm>＋ match</span></div>';
  d.matches.forEach((m,i)=>{
    h+='<div class="mrow"><input class="opp" data-opp="'+i+'" placeholder="Adversaire" value="'+esc(m.opponent)+'">'+
       '<div class="score"><div class="stepper"><button data-m="gf" data-i="'+i+'" data-op="-1">−</button><span class="n">'+num(m.gf)+'</span><button data-m="gf" data-i="'+i+'" data-op="1">+</button></div>'+
       '<span class="sep">:</span><div class="stepper"><button data-m="ga" data-i="'+i+'" data-op="-1">−</button><span class="n">'+num(m.ga)+'</span><button data-m="ga" data-i="'+i+'" data-op="1">+</button></div></div>'+
       (d.matches.length>1?'<button class="rm" data-rmm="'+i+'">×</button>':'')+'</div>';
  });
  h+='<div class="subsec">Buteurs <span class="add" data-adds>＋ buteur</span></div>';
  d.scorers.forEach((s,i)=>{ h+=playerRow("s",i,s); });
  h+='<div class="subsec">Passeurs <span class="add" data-adda>＋ passeur</span></div>';
  d.assists.forEach((s,i)=>{ h+=playerRow("a",i,s); });
  h+='<button class="save" id="saveBtn">'+(d.id?'Enregistrer les modifs':'Enregistrer le plateau')+'</button>';
  document.getElementById("sheetBody").innerHTML=h;
  wireSheet();
}
function playerRow(kind,i,s){
  const star=s.name===STAR;
  return '<div class="prow">'+
    (star?'<input class="pn" value="'+esc(s.name)+'" readonly style="font-weight:700;color:var(--royal)">'
         :'<input class="pn" data-'+kind+'name="'+i+'" placeholder="Nom" value="'+esc(s.name)+'">')+
    '<div class="stepper"><button data-'+kind+'g="'+i+'" data-op="-1">−</button><span class="n">'+num(s.goals)+'</span><button data-'+kind+'g="'+i+'" data-op="1">+</button></div>'+
    (star?'':'<button class="rm" data-'+kind+'rm="'+i+'">×</button>')+'</div>';
}
function wireSheet(){
  const root=document.getElementById("sheetBody"), $=(s)=>root.querySelectorAll(s), d=state.draft;
  document.getElementById("f-date").onchange=e=>{d.date=e.target.value;};
  $("[data-pos]").forEach(el=>el.onclick=()=>{ const p=el.dataset.pos, i=d.positions.indexOf(p); if(i>=0)d.positions.splice(i,1); else d.positions.push(p); renderSheet(); });
  $("[data-opp]").forEach(el=>el.oninput=e=>{d.matches[+el.dataset.opp].opponent=e.target.value;});
  $("[data-m]").forEach(el=>el.onclick=()=>{ const i=+el.dataset.i,f=el.dataset.m; d.matches[i][f]=Math.max(0,num(d.matches[i][f])+ +el.dataset.op); renderSheet(); });
  $("[data-addm]").forEach(el=>el.onclick=()=>{ d.matches.push({opponent:"",gf:0,ga:0}); renderSheet(); });
  $("[data-rmm]").forEach(el=>el.onclick=()=>{ d.matches.splice(+el.dataset.rmm,1); renderSheet(); });
  $("[data-sname]").forEach(el=>el.oninput=e=>{d.scorers[+el.dataset.sname].name=e.target.value;});
  $("[data-sg]").forEach(el=>el.onclick=()=>{ const i=+el.dataset.sg; d.scorers[i].goals=Math.max(0,num(d.scorers[i].goals)+ +el.dataset.op); renderSheet(); });
  $("[data-srm]").forEach(el=>el.onclick=()=>{ d.scorers.splice(+el.dataset.srm,1); renderSheet(); });
  $("[data-aname]").forEach(el=>el.oninput=e=>{d.assists[+el.dataset.aname].name=e.target.value;});
  $("[data-ag]").forEach(el=>el.onclick=()=>{ const i=+el.dataset.ag; d.assists[i].goals=Math.max(0,num(d.assists[i].goals)+ +el.dataset.op); renderSheet(); });
  $("[data-arm]").forEach(el=>el.onclick=()=>{ d.assists.splice(+el.dataset.arm,1); renderSheet(); });
  $("[data-adds]").forEach(el=>el.onclick=()=>{ d.scorers.push({name:"",goals:1}); renderSheet(); });
  $("[data-adda]").forEach(el=>el.onclick=()=>{ d.assists.push({name:"",goals:1}); renderSheet(); });
  const fc=document.getElementById("f-coach"); if(fc) fc.oninput=e=>{d.coach=e.target.value;};
  document.getElementById("saveBtn").onclick=savePlateau;
}
async function savePlateau(){
  const d=state.draft; if(!d)return;
  const btn=document.getElementById("saveBtn"); btn.disabled=true; btn.textContent="Enregistrement…";
  const scorers={},assists={};
  d.scorers.forEach(s=>{const n=(s.name||"").trim(); if(n&&num(s.goals)>0)scorers[n]=(scorers[n]||0)+num(s.goals);});
  d.assists.forEach(s=>{const n=(s.name||"").trim(); if(n&&num(s.goals)>0)assists[n]=(assists[n]||0)+num(s.goals);});
  const matches=d.matches.filter(m=>(m.opponent||"").trim()!==""||num(m.gf)>0||num(m.ga)>0)
    .map(m=>({opponent:(m.opponent||"").trim(),gf:num(m.gf),ga:num(m.ga)}));
  const id=d.id||('pl_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const body={ id, user_id:USER.id, date:d.date, coach:(d.coach||"").trim(), positions:[...d.positions], matches, scorers, assists };
  try{
    const { error } = await sb.from('plateaux').upsert(body);
    if(error) throw error;
    const i=state.plateaux.findIndex(x=>x.id===id);
    if(i>=0) state.plateaux[i]=body; else state.plateaux.push(body);
    closeSheet(); render();
  }catch(e){ btn.disabled=false; btn.textContent="Réessayer"; alert("Erreur d'enregistrement. Réessaie."); }
}
async function delPlateau(id){
  if(!confirm("Supprimer ce plateau ? Action définitive.")) return;
  try{
    const { error } = await sb.from('plateaux').delete().eq('id', id);
    if(error) throw error;
    state.plateaux=state.plateaux.filter(x=>x.id!==id); render();
  }catch(e){ alert("Suppression impossible. Réessaie."); }
}
</script>
